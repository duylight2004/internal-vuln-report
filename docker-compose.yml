services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ctf_root_pass
      MYSQL_DATABASE: vuln_report
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: ctf_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: ctf_user
      DB_PASS: ctf_pass
      DB_NAME: vuln_report
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env or environment}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
