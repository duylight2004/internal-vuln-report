{% extends "base.html" %}
{% block title %}Đăng Nhập - Trạm Hỷ Security{% endblock %}
{% block header_title %}Xác Thực Danh Tính{% endblock %}

{% block content %}
<div class="flex justify-center items-center py-8">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl border border-gray-150 shadow-lg blush-glow relative overflow-hidden">
        <div class="absolute top-0 right-0 w-36 h-36 bg-brand-gold/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
        
        <div class="text-center mb-6 relative z-10">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="w-14 h-14 mx-auto rounded-full object-cover border-2 border-brand-gold/40 shadow-sm mb-3" onerror="this.src='https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=100'">
            <h2 class="serif-title text-2xl font-bold text-brand-text">Đăng Nhập</h2>
            <p class="text-xs text-gray-400 mt-1">Cổng kiểm toán an toàn hệ thống Trạm Hỷ</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4 relative z-10">
            <div>
                <label for="username" class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Tên Đăng Nhập</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-gray-400 text-lg">person</span>
                    <input type="text" id="username" name="username" required autofocus placeholder="nhập tên tài khoản..." class="w-full pl-11 pr-4 py-2.5 bg-brand-blush/60 border border-gray-200 rounded-xl text-xs text-brand-text focus:outline-none focus:ring-2 focus:ring-brand-gold/50 focus:border-brand-gold transition-all">
                </div>
            </div>

            <div>
                <label for="password" class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Mật Khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-gray-400 text-lg">lock</span>
                    <input type="password" id="password" name="password" required placeholder="nhập mật khẩu..." class="w-full pl-11 pr-4 py-2.5 bg-brand-blush/60 border border-gray-200 rounded-xl text-xs text-brand-text focus:outline-none focus:ring-2 focus:ring-brand-gold/50 focus:border-brand-gold transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 gold-gradient text-white rounded-xl text-xs font-bold tracking-wider uppercase shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
                <span>Đăng Nhập Vào Hệ Thống</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-gray-100 text-xs text-gray-400">
            Chưa có tài khoản kiểm toán? 
            <a href="{{ url_for('register') }}" class="font-bold text-brand-goldDark hover:underline ml-1">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}
