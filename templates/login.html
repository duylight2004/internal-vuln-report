{% extends "base.html" %}
{% block title %}Đăng Nhập — Trạm Hỷ{% endblock %}

{% block content %}
<div class="flex justify-center items-center py-12">
    <div class="w-full max-w-md glass-card p-10 relative overflow-hidden">
        <!-- Subtle Pink Bloom -->
        <div class="absolute top-0 right-0 w-48 h-48 bg-[#FF4D85]/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Trạm Hỷ" class="w-16 h-16 mx-auto rounded-full object-cover border border-[#FF4D85]/40 shadow-lg mb-4" onerror="this.src='{{ url_for('static', filename='img/logo.jpg') }}'">
            <span class="mono-tag text-[10px] text-[#FF4D85] font-semibold block mb-1">A U T H E N T I C A T I O N</span>
            <h1 class="stamped-heading text-3xl font-light text-white m-0">Đăng Nhập Cổng An Toàn</h1>
            <p class="text-xs text-[#828384] mt-2">Bảo chứng giao dịch và kiểm toán bảo mật Trạm Hỷ</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-5 relative z-10">
            <div>
                <label for="username" class="block text-[11px] mono-tag text-[#828384] mb-2 font-medium">Tên Đăng Nhập</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-[#828384] text-lg">person</span>
                    <input type="text" id="username" name="username" required autofocus placeholder="nhập tài khoản..." class="w-full pl-11 pr-4 py-3 bg-white/[0.04] border border-white/15 rounded-xl text-sm text-[#f7f9fa] placeholder-[#828384] focus:outline-none focus:border-[#FF4D85] focus:ring-1 focus:ring-[#FF4D85] transition-all">
                </div>
            </div>

            <div>
                <label for="password" class="block text-[11px] mono-tag text-[#828384] mb-2 font-medium">Mật Khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-[#828384] text-lg">lock</span>
                    <input type="password" id="password" name="password" required placeholder="nhập mật khẩu..." class="w-full pl-11 pr-4 py-3 bg-white/[0.04] border border-white/15 rounded-xl text-sm text-[#f7f9fa] placeholder-[#828384] focus:outline-none focus:border-[#FF4D85] focus:ring-1 focus:ring-[#FF4D85] transition-all">
                </div>
            </div>

            <button type="submit" class="btn-violet w-full justify-center !py-3.5 text-sm uppercase mono-tag mt-2">
                <span>Đăng Nhập Vào Hệ Thống</span>
                <span class="material-symbols-outlined text-base">arrow_forward</span>
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-white/10 text-xs text-[#828384]">
            Chưa có tài khoản kiểm toán? 
            <a href="{{ url_for('register') }}" class="text-[#FF4D85] hover:underline font-semibold ml-1">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}
