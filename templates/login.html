{% extends "base.html" %}
{% block title %}Đăng nhập - IVRS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4 shadow-lg">
      <div class="text-center mb-4">
        <h3 class="fw-bold font-heading">Đăng Nhập</h3>
        <p class="text-muted small">Hệ thống báo cáo lỗ hổng an ninh nội bộ</p>
      </div>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label text-secondary small fw-semibold">TÊN ĐĂNG NHẬP</label>
          <input type="text" class="form-control form-control-custom" id="username" name="username" required autofocus placeholder="nhập tên đăng nhập...">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label text-secondary small fw-semibold">MẬT KHẨU</label>
          <input type="password" class="form-control form-control-custom" id="password" name="password" required placeholder="nhập mật khẩu...">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Đăng Nhập</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted small">Chưa có tài khoản?</span>
        <a href="{{ url_for('register') }}" class="small ms-1 text-info text-decoration-none">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
