{% extends "base.html" %}
{% block title %}Đăng ký tài khoản - IVRS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4 shadow-lg">
      <div class="text-center mb-4">
        <h3 class="fw-bold font-heading">Đăng Ký</h3>
        <p class="text-muted small">Tạo tài khoản thành viên báo cáo lỗ hổng</p>
      </div>
      <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label for="username" class="form-label text-secondary small fw-semibold">TÊN ĐĂNG NHẬP</label>
          <input type="text" class="form-control form-control-custom" id="username" name="username" required autofocus placeholder="tối đa 30 ký tự khuyến nghị...">
          <div class="form-text text-muted small">Gợi ý: Tên đăng nhập được dùng làm định danh tác giả trên các báo cáo và nhật ký xuất dữ liệu.</div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label text-secondary small fw-semibold">MẬT KHẨU</label>
          <input type="password" class="form-control form-control-custom" id="password" name="password" required placeholder="nhập mật khẩu...">
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Tạo Tài Khoản</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted small">Đã có tài khoản?</span>
        <a href="{{ url_for('login') }}" class="small ms-1 text-info text-decoration-none">Đăng nhập</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
